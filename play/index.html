<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoWho — Challenge</title>
  <meta name="description" content="Open this GeoWho challenge in the app." />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #0b1220; color: #e8eef8; padding: 24px; text-align: center;
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: 0.04em; }
    p { margin: 0 0 20px; color: #9aa8bd; max-width: 28rem; line-height: 1.45; }
    a {
      display: inline-block; padding: 12px 18px; border-radius: 12px;
      background: #3b82f6; color: #fff; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>GEOWHO</h1>
    <p id="msg">Open this challenge in the GeoWho app. If the app is installed, iOS should open it automatically.</p>
    <p><a href="https://testflight.apple.com/join/EZm26ZP1">Get GeoWho on TestFlight</a></p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var daily = params.get('daily');
      var run = params.get('run');
      var figure = params.get('figure');
      var exhibit = params.get('exhibit') || params.get('pack');
      var el = document.getElementById('msg');
      if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily)) {
        el.textContent = 'Today’s GeoWho · ' + daily + ' — open the app to play the daily challenge.';
      } else if (run) {
        el.textContent = 'Beat my run — open GeoWho to play the same five figures.';
      } else if (exhibit && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(exhibit)) {
        el.textContent = 'Free Exhibit — a five-chapter story challenge. Open GeoWho to begin.';
      } else if (figure && /^Q[0-9]+$/.test(figure)) {
        el.textContent = 'A friend challenged you — open GeoWho to guess who from the map.';
      }
    })();
  </script>
</body>
</html>
